[project]
name = "newsflow2"
version = "0.1.0"
description = "Telegram publisher for PC hardware launch news"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.22.0",
  "beautifulsoup4>=4.13.4",
  "feedparser>=6.0.11",
  "httpx>=0.28.1",
  "loguru>=0.7.3",
  "pillow>=11.3.0",
  "pydantic-settings>=2.10.1",
  "pyyaml>=6.0.2",
  "trafilatura>=2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.1",
  "ruff>=0.12.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
