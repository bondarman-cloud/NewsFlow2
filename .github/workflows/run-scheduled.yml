name: Scheduled Hardware News
run-name: Hardware News automatic

on:
  schedule:
    - cron: "19,49 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    uses: ./.github/workflows/run-bot.yml
    with:
      bot_id: hardware_news
      run_mode: scheduled
      force_publish: false
      database_path: data/newsflow2.db
      cache_prefix: hardware-news-db-v1
    secrets:
      bot_token: ${{ secrets.BOT_TOKEN }}
      channel_id: ${{ secrets.CHANNEL_ID }}
      gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
