name: Scheduled Hardware News
run-name: Hardware News automatic

on:
  schedule:
    # Three attempts near the start of every hour. The application interval
    # prevents more than one successful scheduled publication per hour.
    - cron: "3,13,23 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    uses: ./.github/workflows/run-bot.yml
    with:
      bot_id: hardware_news
      run_mode: scheduled
      force_publish: false
      database_path: data/newsflow2.db
      cache_prefix: hardware-news-db-v1
      legacy_cache_prefix: newsflow2-db-v6
    secrets:
      bot_token: ${{ secrets.BOT_TOKEN }}
      channel_id: ${{ secrets.CHANNEL_ID }}
      gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
