name: Run NewsFlow2 manually
run-name: NewsFlow2 manual

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: newsflow2-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      DATABASE_PATH: data/newsflow2.db
      MAX_ARTICLES_PER_RUN: 1
      MAX_CANDIDATES: 500
      MAX_AGE_HOURS: 336
      PUBLISH_INTERVAL: 3300
      FORCE_PUBLISH: true
      RUN_MODE: manual
      LOG_LEVEL: INFO

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Prepare runtime
        run: mkdir -p data cache/images

      - name: Restore publication database
        uses: actions/cache@v4
        with:
          path: data/newsflow2.db
          key: newsflow2-db-v5-${{ github.run_id }}
          restore-keys: |
            newsflow2-db-v5-
            newsflow2-db-v4-
            newsflow2-db-v2-

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Validate secrets
        run: |
          python - <<'PY'
          import os
          missing = [name for name in ("BOT_TOKEN", "CHANNEL_ID", "GEMINI_API_KEY") if not os.getenv(name)]
          if missing:
              raise SystemExit("Missing GitHub secrets: " + ", ".join(missing))
          print("Required secrets are configured.")
          PY

      - name: Publish one article
        run: python main.py
