name: Run Hardware News manually
run-name: Hardware News manual

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    uses: ./.github/workflows/run-bot.yml
    with:
      bot_id: hardware_news
      run_mode: manual
      force_publish: true
      database_path: data/newsflow2.db
      cache_prefix: hardware-news-db-v1
      legacy_cache_prefix: newsflow2-db-v6
    secrets:
      bot_token: ${{ secrets.BOT_TOKEN }}
      channel_id: ${{ secrets.CHANNEL_ID }}
      gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
