name: Run Hardware News manually
run-name: Hardware News manual

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      BOT_ID: hardware_news
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      DATABASE_PATH: data/newsflow2.db
      IMAGE_CACHE_DIR: cache/images/hardware_news
      FORCE_PUBLISH: "true"
      RUN_MODE: manual
      LOG_LEVEL: INFO

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Prepare runtime
        run: |
          mkdir -p "$(dirname "$DATABASE_PATH")" "$IMAGE_CACHE_DIR"

      - name: Restore publication database
        uses: actions/cache@v4
        with:
          path: data/newsflow2.db
          key: hardware-news-db-v1-${{ github.run_id }}
          restore-keys: |
            hardware-news-db-v1-
            newsflow2-db-v6-

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Validate profile and secrets
        run: |
          python - <<'PY'
          import os
          from app.config import settings

          missing = [
              name
              for name in ("BOT_TOKEN", "CHANNEL_ID", "GEMINI_API_KEY")
              if not os.getenv(name)
          ]
          if missing:
              raise SystemExit("Missing GitHub secrets: " + ", ".join(missing))
          print(f"Profile: {settings.bot_id} ({settings.title})")
          print(f"Sources: {settings.sources_path}")
          print(f"Database: {settings.database_path}")
          PY

      - name: Publish one article
        run: python main.py --bot "$BOT_ID" --mode "$RUN_MODE" --force
