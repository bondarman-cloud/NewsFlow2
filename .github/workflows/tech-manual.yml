name: Run Technology News manually
run-name: Technology News manual

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    uses: ./.github/workflows/run-bot.yml
    with:
      bot_id: tech_news
      run_mode: manual
      force_publish: true
      database_path: data/tech_news.db
      cache_prefix: tech-news-db-v1
      legacy_cache_prefix: tech-news-db-v1
    secrets:
      bot_token: ${{ secrets.TECH_BOT_TOKEN }}
      channel_id: ${{ secrets.TECH_CHANNEL_ID }}
      gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
