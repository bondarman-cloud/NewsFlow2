name: Reusable bot runner

on:
  workflow_call:
    inputs:
      bot_id:
        required: true
        type: string
      run_mode:
        required: true
        type: string
      force_publish:
        required: true
        type: boolean
      database_path:
        required: true
        type: string
      cache_prefix:
        required: true
        type: string
      legacy_cache_prefix:
        required: true
        type: string
    secrets:
      bot_token:
        required: true
      channel_id:
        required: true
      gemini_api_key:
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ inputs.bot_id }}-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      BOT_ID: ${{ inputs.bot_id }}
      BOT_TOKEN: ${{ secrets.bot_token }}
      CHANNEL_ID: ${{ secrets.channel_id }}
      GEMINI_API_KEY: ${{ secrets.gemini_api_key }}
      DATABASE_PATH: ${{ inputs.database_path }}
      IMAGE_CACHE_DIR: cache/images/${{ inputs.bot_id }}
      FORCE_PUBLISH: ${{ inputs.force_publish }}
      RUN_MODE: ${{ inputs.run_mode }}
      LOG_LEVEL: INFO

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Prepare runtime
        run: |
          mkdir -p "$(dirname "$DATABASE_PATH")" "$IMAGE_CACHE_DIR"

      - name: Restore publication database
        uses: actions/cache@v4
        with:
          path: ${{ inputs.database_path }}
          key: ${{ inputs.cache_prefix }}-${{ github.run_id }}
          restore-keys: |
            ${{ inputs.cache_prefix }}-
            ${{ inputs.legacy_cache_prefix }}-

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Validate profile and secrets
        run: |
          python - <<'PY'
          import os
          from app.config import settings

          missing = [
              name
              for name in ("BOT_TOKEN", "CHANNEL_ID", "GEMINI_API_KEY")
              if not os.getenv(name)
          ]
          if missing:
              raise SystemExit("Missing GitHub secrets: " + ", ".join(missing))
          print(f"Profile: {settings.bot_id} ({settings.title})")
          print(f"Sources: {settings.sources_path}")
          print(f"Database: {settings.database_path}")
          PY

      - name: Check Telegram and Gemini access
        run: |
          python - <<'PY'
          import asyncio
          import os

          import httpx


          async def main() -> None:
              token = os.environ["BOT_TOKEN"]
              channel_id = os.environ["CHANNEL_ID"]
              api_key = os.environ["GEMINI_API_KEY"]

              async with httpx.AsyncClient(timeout=httpx.Timeout(20.0)) as client:
                  telegram_base = f"https://api.telegram.org/bot{token}"

                  response = await client.get(f"{telegram_base}/getMe")
                  if response.status_code != 200 or not response.json().get("ok"):
                      raise SystemExit(
                          f"Telegram BOT_TOKEN rejected: HTTP {response.status_code}"
                      )
                  bot_name = response.json()["result"].get("username", "unknown")

                  response = await client.get(
                      f"{telegram_base}/getChat",
                      params={"chat_id": channel_id},
                  )
                  if response.status_code != 200 or not response.json().get("ok"):
                      description = response.json().get("description", "unknown error")
                      raise SystemExit(
                          "Telegram channel is unavailable to the bot: "
                          f"HTTP {response.status_code}, {description}"
                      )

                  response = await client.get(
                      "https://generativelanguage.googleapis.com/v1beta/models",
                      params={"key": api_key},
                  )
                  if response.status_code != 200:
                      raise SystemExit(
                          f"GEMINI_API_KEY rejected: HTTP {response.status_code}"
                      )

              print(f"External services are available for @{bot_name}")


          asyncio.run(main())
          PY

      - name: Publish one article
        run: |
          force_arg=""
          if [[ "${FORCE_PUBLISH,,}" == "true" ]]; then
            force_arg="--force"
          fi
          python main.py --bot "$BOT_ID" --mode "$RUN_MODE" $force_arg
