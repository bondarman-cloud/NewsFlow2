name: Publish all channels now
run-name: Publish all channels now

on:
  push:
    branches: [main]
    paths:
      - ".automation/publish-all-now.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hardware:
    uses: ./.github/workflows/run-bot.yml
    with:
      bot_id: hardware_news
      run_mode: manual
      force_publish: true
      database_path: data/newsflow2.db
      cache_prefix: hardware-news-db-v1
      legacy_cache_prefix: newsflow2-db-v6
    secrets:
      bot_token: ${{ secrets.BOT_TOKEN }}
      channel_id: ${{ secrets.CHANNEL_ID }}
      gemini_api_key: ${{ secrets.GEMINI_API_KEY }}

  technology:
    uses: ./.github/workflows/run-bot.yml
    with:
      bot_id: tech_news
      run_mode: manual
      force_publish: true
      database_path: data/tech_news.db
      cache_prefix: tech-news-db-v1
      legacy_cache_prefix: tech-news-db-v1
    secrets:
      bot_token: ${{ secrets.TECH_BOT_TOKEN }}
      channel_id: ${{ secrets.TECH_CHANNEL_ID }}
      gemini_api_key: ${{ secrets.GEMINI_API_KEY }}

  worldfood:
    uses: ./.github/workflows/run-bot.yml
    with:
      bot_id: worldfood_bot
      run_mode: manual
      force_publish: true
      database_path: data/worldfood_bot.db
      cache_prefix: worldfood-db-v1
      legacy_cache_prefix: worldfood-db-v1
    secrets:
      bot_token: ${{ secrets.WORLDFOOD_BOT_TOKEN }}
      channel_id: ${{ secrets.WORLDFOOD_CHANNEL_ID }}
      gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
