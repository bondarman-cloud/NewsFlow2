name: Validate Bot Platform

on:
  push:
    branches:
      - main
      - "feature/**"
      - worldfood-bot
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BOT_ID: hardware_news
      BOT_TOKEN: test-token
      CHANNEL_ID: "-1000000000000"
      GEMINI_API_KEY: test-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Compile
        run: python -m compileall -q app main.py

      - name: Lint
        run: ruff check app tests main.py

      - name: Test
        run: pytest -q

      - name: Validate bot profiles
        run: |
          python - <<'PY'
          from app.config import load_bot_profile

          for bot_id in ("hardware_news", "tech_news", "worldfood_bot"):
              profile = load_bot_profile(bot_id)
              assert profile.sources_path.is_file()
              assert profile.prompt_path.is_file()
              print(bot_id, profile.title, profile.application)
          PY
